[project]
name = "trading-bot"
version = "0.1.0"
description = "Disciplined intraday options bot on Schwab. See SPEC.md."
requires-python = ">=3.12,<3.13"
dependencies = [
    "pandas>=2.2,<3",
    "numpy>=2.0,<3",
    "pyarrow>=17",
    "pyyaml>=6.0",
    "pydantic>=2.8,<3",
    "exchange-calendars>=4.5",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "hypothesis>=6.100",
    "ruff>=0.6",
]
# Installed when the Schwab app is approved (`uv sync --group broker`).
broker = [
    "schwabdev>=2.4",
]
# Research/backtest stack. TA-Lib needs the C library installed first
# (brew install ta-lib / apt install libta-lib-dev), so it's opt-in.
research = [
    "pandas-ta-classic>=0.3",
    "py-vollib>=1.0",
    "vectorbt>=0.26",
    "duckdb>=1.0",
]
llm = [
    "anthropic>=0.40",
]
infra = [
    "aws-cdk-lib>=2.160,<3",
    "constructs>=10.3,<11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bot"]

[tool.uv]
default-groups = ["dev"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "DTZ"]
